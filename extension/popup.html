<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 280px;
        margin: 0;
        padding: 16px;
      }
      h1 { font-size: 15px; margin: 0 0 12px; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 7px;
        font: inherit;
        background: transparent;
        color: inherit;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: #0a84ff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: rgba(128, 128, 128, 0.22); color: inherit; }
      #msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
      #msg.err { color: #ff453a; }
      #msg.ok { color: #30d158; }
      .signed { font-size: 12px; color: rgba(128,128,128,0.9); word-break: break-all; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>Moodboard</h1>

    <div id="loginView">
      <label for="serverUrl">Servidor</label>
      <input id="serverUrl" type="url" placeholder="https://moodboard-sync.xxx.workers.dev" />
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="tu@email.com" />
      <label for="password">Contraseña</label>
      <input id="password" type="password" />
      <button id="loginBtn">Entrar</button>
      <div id="msg"></div>
    </div>

    <div id="sessionView" class="hidden">
      <p class="signed">Sesión iniciada como<br /><b id="whoEmail"></b><br /><span id="whoServer"></span></p>
      <p style="font-size:12px;color:rgba(128,128,128,0.9)">
        Pasa el cursor sobre una imagen en Instagram y pulsa el botón de la bandeja para guardarla.
      </p>
      <button id="logoutBtn" class="secondary">Cerrar sesión</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
